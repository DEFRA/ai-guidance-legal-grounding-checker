name: component-names

on:
  push:
  pull_request:

jobs:
  legacy-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ban-list personal component codenames
        run: python scripts/check_legacy_component_names.py
      - name: Validate README component table
        run: python scripts/render_component_table.py --check
