[project]
name = "law-proposition-extractor-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.136.1",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.8.0",
  "uvicorn[standard]>=0.35.0",
  "law-proposition-extractor-domain",
  "law-proposition-extractor-exporters",
  "law-proposition-extractor-llm",
  "law-proposition-extractor-pipeline",
  "law-proposition-extractor-storage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/law_proposition_extractor_api"]
