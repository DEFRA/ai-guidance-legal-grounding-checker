[project]
name = "proposition-matcher"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "openai>=1.76.0",
    "anthropic>=0.40",
]

[project.scripts]
proposition-matcher = "proposition_matcher.cli:main"
beatrice = "compat.legacy_cli:beatrice"  # COMPAT_LEGACY_NAME

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proposition_matcher", "src/beatrice"]  # COMPAT_LEGACY_NAME

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
