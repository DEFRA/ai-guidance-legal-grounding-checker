[project]
name = "guidance-relevance-web"
version = "0.1.0"
description = "Operator UI for Guidance Relevance Filter — category wizard, caps, jobs, Excel handoff"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "guidance-relevance-filter",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic-settings>=2.8",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
guidance-relevance-web = "guidance_relevance_web.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guidance_relevance_web"]

[tool.uv.sources]
guidance-relevance-filter = { path = "../guidance-relevance-filter", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
