# Canonical component manifest — machine-readable source of truth for pipeline identity.
# Root README component table is generated/validated from this file.
# See NAMES.md for historic glossary; docs/migration-component-rename.md for compat contract.

schema_version: 1
alias_removal_release: rename+1
naming_standard: |
  A component name identifies (1) the corpus or pipeline object it operates on where
  needed to remove ambiguity, and (2) the capability it provides. Components providing
  the same capability against different corpora share the same capability suffix.
  The canonical technical slug is the kebab-case form of the canonical display name.
  Law is the agreed source term (not qualified by jurisdiction in component names).

platform_exceptions:
  - rule: python_import_packages_use_underscores
    reason: Python import paths cannot contain hyphens
    mapping: "kebab slug → snake_case import package (e.g. law-proposition-extractor → law_proposition_extractor)"

components:
  - id: scope-planner
    display_name: Scope Planner
    slug: scope-planner
    responsibility: Select the audit category and develop its operational scope definition
    source_kind: manual
    capability: scope-planning
    legacy_codename: Grace
    deprecated_aliases: [grace, Grace]
    alias_removal_release: rename+1
    package: null
    directory: null
    frozen_id_patterns: []

  - id: guidance-discovery
    display_name: Guidance Discovery
    slug: guidance-discovery
    responsibility: Find potentially in-scope GOV.UK guidance pages and retrieve their source content
    source_kind: guidance
    capability: discovery
    legacy_codename: Mary
    deprecated_aliases: [mary, Mary]
    alias_removal_release: rename+1
    package: guidance-discovery
    directory: guidance-discovery
    python_import: null
    frozen_id_patterns: []

