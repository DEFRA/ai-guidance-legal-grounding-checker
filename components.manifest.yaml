    source_kind: guidance
    capability: proposition-extractor
    legacy_codename: Susan
    deprecated_aliases: [susan, Susan]
    alias_removal_release: rename+1
    package: guidance-proposition-extractor
    directory: guidance-proposition-extractor
    python_import: guidance_proposition_extractor
    frozen_id_patterns:
      - "susan-<slug>-<n> guidance proposition IDs (byte-stable; do not rewrite)"
      - 'extraction_method="susan" (byte-stable; do not rewrite)'

