[project]
name = "guidance-relevance-filter"
version = "0.1.0"
description = "Guidance Relevance Filter — on-topic guidance filter (word-search routing + Claude Haiku)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "ijson>=3.3",
    "nltk>=3.9",
    "python-dotenv>=1.0",
    "typer>=0.15",
]

[project.optional-dependencies]
cosine = [
    "sentence-transformers>=3.0.0",
    "einops>=0.8.2",
]

[project.scripts]
guidance-relevance-filter = "guidance_relevance_filter.cli:app"
radia = "compat.legacy_cli:radia"  # COMPAT_LEGACY_NAME

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pytest>=8.3",
    "ruff>=0.9",
]
notebook = [
    "pandas>=2.2",
    "jupyter>=1.1",
    "ipywidgets>=8.1",
    "matplotlib>=3.9",
]
web = [
    "streamlit>=1.41",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guidance_relevance_filter", "src/radia"]  # COMPAT_LEGACY_NAME

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
reportMissingTypeStubs = false
